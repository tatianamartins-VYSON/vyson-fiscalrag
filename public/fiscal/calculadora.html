<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vyson Fiscal · Calculadora de atualização monetária</title>
<style>
:root{--bg:#081127;--card:#0f1d3d;--ink:#eef2ff;--mut:#9fb0d6;--line:#22345f;--lar:#ff8000}
*{box-sizing:border-box}body{margin:0;font:15px/1.55 Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:22px 16px;background:linear-gradient(90deg,#0b2a6b,#081127)}header h1{margin:0;font-size:22px}header p{margin:4px 0 0;color:var(--mut);font-size:13px}
main{max-width:980px;margin:0 auto;padding:16px}a{color:#ffb35c}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
input,select{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:#071026;color:var(--ink);font:inherit}
button{background:linear-gradient(90deg,#ff6b00,#ffa500);border:0;color:#081127;font-weight:700;padding:10px 18px;border-radius:10px;cursor:pointer;font:inherit;font-weight:700}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.res div{background:#071026;border:1px solid var(--line);border-radius:10px;padding:10px}.res b{display:block;font-size:20px;color:#ffd27a}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}
.neg{color:#ff9a9a}.al{background:rgba(255,128,0,.12);border:1px solid var(--lar);border-radius:10px;padding:10px;margin:10px 0}
.mut{color:var(--mut);font-size:13px}
@media print{body{background:#fff;color:#000}header,.noprint{display:none}.card{border-color:#999;background:#fff}.res div{background:#fff}}
</style></head><body>
<header><h1>Calculadora de atualização monetária</h1><p>Índices oficiais do Banco Central e do IBGE, atualizados automaticamente. Memória de cálculo pronta para o laudo. <a href="./">← Vyson Fiscal</a></p></header>
<main>
<div class="card noprint">
  <div class="grid">
    <div><label>Valor original (R$)</label><input id="valor" type="number" step="0.01" value="1000.00"></div>
    <div><label>Data-base</label><input id="base" type="date" value="2024-01-15"></div>
    <div><label>Data do cálculo</label><input id="fim" type="date"></div>
    <div><label>Índice de correção</label><select id="indice"></select></div>
    <div><label>Juros simples (% ao mês, opcional)</label><input id="juros" type="number" step="0.0001" value="0"></div>
    <div><label>Juros a partir de (opcional)</label><input id="jdesde" type="date"></div>
  </div>
  <p><label><input id="trava" type="checkbox" style="width:auto"> Aplicar trava do valor nominal em caso de deflação acumulada</label></p>
  <button id="go">Calcular</button> <button id="imp" type="button">Imprimir memória</button>
  <p class="mut" id="fontes">Carregando índices oficiais…</p>
</div>
<div id="out"></div>
</main>
<script src="calculo.js"></script>
<script>
const $=id=>document.getElementById(id), brl=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const hoje=new Date(); $("fim").value=hoje.toISOString().slice(0,10);
let IDX={};
fetch("indices.json",{cache:"no-store"}).then(r=>r.json()).then(j=>{
  IDX=j;
  $("indice").innerHTML=Object.keys(j).map(k=>`<option ${k==="IPCA"?"selected":""}>${k}</option>`).join("");
  $("fontes").textContent="Índices disponíveis: "+Object.entries(j).map(([k,v])=>`${k} até ${v.ultimo}`).join(" · ");
}).catch(()=>{$("fontes").textContent="Não foi possível carregar os índices."});
$("imp").onclick=()=>window.print();
$("go").onclick=()=>{
  const nome=$("indice").value, I=IDX[nome]; if(!I) return;
  const r=CalcVyson.atualizar({valor:+$("valor").value,base:$("base").value,fim:$("fim").value,serie:I.serie,nome,
    jurosPct:+$("juros").value||0,jurosDesde:$("jdesde").value||null,travaNominal:$("trava").checked,hoje});
  $("out").innerHTML=`<div class="card"><h2 style="margin-top:0">Resultado</h2>
  <div class="res"><div>Fator acumulado<b>${r.fator.replace(".",",")}</b></div><div>Valor corrigido<b>${brl(r.corrigido)}</b></div>
  <div>Juros${r.nJuros?` (${r.nJuros} meses)`:""}<b>${brl(r.juros)}</b></div><div>Total<b>${brl(r.total)}</b></div></div>
  ${r.alertas.length?`<div class="al"><b>Alertas para conferência</b><br>${r.alertas.map(a=>"• "+a).join("<br>")}</div>`:""}
  <h3>Memória de cálculo</h3>
  <p class="mut">Valor original ${brl(+$("valor").value)} em ${$("base").value.split("-").reverse().join("/")}, atualizado até ${$("fim").value.split("-").reverse().join("/")} pelo ${nome}.
  Fonte: ${I.fonte} · baixado em ${I.baixado_em.slice(0,10)} · SHA-256 ${I.sha256.slice(0,12)}…
  Regra: correção do mês seguinte à data-base até o mês do cálculo; fator acumulado com 9 casas (meio para cima); valores arredondados só no final${r.nJuros?"; juros simples sobre o valor corrigido":""}.</p>
  <table><tr><th>Mês</th><th>${nome} (%)</th><th>Fator acumulado</th></tr>
  ${r.memoria.map(m=>`<tr class="${m.negativo?"neg":""}"><td>${m.mes.split("-").reverse().join("/")}</td><td>${m.pct.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:4})}</td><td>${m.fator.replace(".",",")}</td></tr>`).join("")}</table>
  <p class="mut">Conferência: contador ____________________ · Perito ____________________</p></div>`;
};
</script></body></html>
